name: Bundle Nettle Neon Function

on:
  push:
    branches: [main]
    paths:
      - "neon-function/api-handler.cjs"
      - "neon-function/package.json"
      - ".github/workflows/bundle-neon-function.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install runtime dependencies and bundler
        working-directory: neon-function
        run: npm install --no-save --package-lock=false esbuild

      - name: Bundle API and verify generated output
        working-directory: neon-function
        run: |
          ./node_modules/.bin/esbuild api-handler.cjs --bundle --platform=node --format=cjs --target=node24 --minify --legal-comments=none --outfile=/tmp/api-handler.bundle.cjs
          node --check /tmp/api-handler.bundle.cjs
          test -s /tmp/api-handler.bundle.cjs
          echo "Bundle verification succeeded. Deployment uses api-handler.cjs directly."
