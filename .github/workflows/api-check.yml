name: API syntax check
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "backend/api-handler.js"
      - "neon-function/**"
      - "package.json"
      - ".github/workflows/api-check.yml"
  pull_request:
    paths:
      - "api/**"
      - "backend/api-handler.js"
      - "neon-function/**"
      - "package.json"
      - ".github/workflows/api-check.yml"
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check shared handler
        run: node --check backend/api-handler.js
      - name: Check legacy API route files
        run: find api -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check active Neon function entrypoint
        run: node --check neon-function/index.mjs
      - name: Check active Neon API handler
        run: node --check neon-function/api-handler.cjs
