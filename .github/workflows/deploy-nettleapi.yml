name: Deploy Nettle API

on:
  push:
    branches: [main]
    paths:
      - "neon.ts"
      - "neon-function/**"
      - "package.json"
      - ".github/workflows/deploy-nettleapi.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nettleapi-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      INITIAL_ADMIN_TELEGRAM_ID: ${{ secrets.INITIAL_ADMIN_TELEGRAM_ID }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      SITE_ORIGIN: ${{ secrets.SITE_ORIGIN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check required secrets
        shell: bash
        run: |
          missing=0
          for key in NEON_API_KEY TELEGRAM_BOT_TOKEN INITIAL_ADMIN_TELEGRAM_ID SESSION_SECRET SITE_ORIGIN; do
            if [ -z "${!key}" ]; then
              echo "::error::Required GitHub Actions secret is missing: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          if [ "${#SESSION_SECRET}" -lt 32 ]; then
            echo "::error::SESSION_SECRET must be at least 32 characters."
            exit 1
          fi

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Install official Neon CLI binary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/neondatabase/neon-pkgs/releases/download/neon%408.14.0/neon-linux-x64" \
            --output /tmp/neon
          chmod 0755 /tmp/neon
          sudo install -m 0755 /tmp/neon /usr/local/bin/neon
          neon --version

      - name: Install esbuild required by Neon Functions
        shell: bash
        run: |
          set -euo pipefail
          npm install --global esbuild
          echo "NEON_ESBUILD_PATH=$(command -v esbuild)" >> "$GITHUB_ENV"
      - name: Deploy the API Function directly
        shell: bash
        run: |
          set -euo pipefail
          neon functions deploy nettleapi \
            --src neon-function \
            --project-id dry-shape-51006688 \
            --branch br-little-union-b9iipjfz \
            --env "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN" \
            --env "INITIAL_ADMIN_TELEGRAM_ID=$INITIAL_ADMIN_TELEGRAM_ID" \
            --env "SESSION_SECRET=$SESSION_SECRET" \
            --env "SITE_ORIGIN=$SITE_ORIGIN"

      - name: Smoke test API CORS and session endpoint
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base = "https://br-little-union-b9iipjfz-nettleapi.compute.c-7.eu-central-1.aws.neon.tech";
          const origin = process.env.SITE_ORIGIN;
          const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let lastError;
          for (let attempt = 1; attempt <= 10; attempt++) {
            try {
              const preflight = await fetch(base + "/api/session", {
                method: "OPTIONS",
                headers: {
                  Origin: origin,
                  "Access-Control-Request-Method": "GET",
                  "Access-Control-Request-Headers": "content-type",
                },
              });
              if (preflight.status !== 204) {
                throw new Error("OPTIONS expected 204, received " + preflight.status);
              }
              if (preflight.headers.get("access-control-allow-origin") !== origin) {
                throw new Error("OPTIONS response has an incorrect Access-Control-Allow-Origin");
              }
              if (preflight.headers.get("access-control-allow-credentials") !== "true") {
                throw new Error("OPTIONS response is missing Access-Control-Allow-Credentials: true");
              }

              const response = await fetch(base + "/api/session", {
                headers: { Origin: origin, "Content-Type": "application/json" },
              });
              const data = await response.json();
              if (!response.ok || typeof data.authenticated !== "boolean") {
                throw new Error("GET /api/session failed with HTTP " + response.status);
              }
              if (response.headers.get("access-control-allow-origin") !== origin) {
                throw new Error("GET response has an incorrect Access-Control-Allow-Origin");
              }
              // Check the custom hostname as well as the Neon-native URL.
              const customBase = "https://api.nettlegroup.space";
              const customPreflight = await fetch(customBase + "/api/session", {
                method: "OPTIONS",
                headers: {
                  Origin: origin,
                  "Access-Control-Request-Method": "GET",
                  "Access-Control-Request-Headers": "content-type",
                },
              });
              if (customPreflight.status !== 204) {
                throw new Error("Custom domain OPTIONS expected 204, received " + customPreflight.status);
              }
              if (customPreflight.headers.get("access-control-allow-origin") !== origin ||
                  customPreflight.headers.get("access-control-allow-credentials") !== "true") {
                throw new Error("Custom domain OPTIONS returned incorrect CORS headers");
              }

              const customResponse = await fetch(customBase + "/api/session", {
                headers: { Origin: origin },
              });
              const customData = await customResponse.json();
              if (!customResponse.ok || typeof customData.authenticated !== "boolean") {
                throw new Error("Custom domain GET /api/session failed with HTTP " + customResponse.status);
              }
              if (customResponse.headers.get("access-control-allow-origin") !== origin) {
                throw new Error("Custom domain GET response has an incorrect Access-Control-Allow-Origin");
              }

              console.log("API smoke test passed: native and custom domain CORS/session endpoints");
              process.exit(0);
            } catch (error) {
              lastError = error;
              if (attempt < 10) await wait(2000);
            }
          }
          console.error("API smoke test failed:", lastError?.message || lastError);
          process.exit(1);
          NODE
