name: Deploy Nettle API

on:
  push:
    branches: [main]
    paths:
      - "neon.ts"
      - "neon-function/**"
      - ".github/workflows/deploy-nettleapi.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nettleapi-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      INITIAL_ADMIN_TELEGRAM_ID: ${{ secrets.INITIAL_ADMIN_TELEGRAM_ID }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      SITE_ORIGIN: ${{ secrets.SITE_ORIGIN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check required secrets
        shell: bash
        run: |
          missing=0
          for key in NEON_API_KEY TELEGRAM_BOT_TOKEN INITIAL_ADMIN_TELEGRAM_ID SESSION_SECRET SITE_ORIGIN; do
            if [ -z "${!key}" ]; then
              echo "::error::Required GitHub Actions secret is missing: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          if [ "${#SESSION_SECRET}" -lt 32 ]; then
            echo "::error::SESSION_SECRET must be at least 32 characters."
            exit 1
          fi

      - name: Create temporary deployment environment
        shell: bash
        run: |
          umask 077
          {
            printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN"
            printf 'INITIAL_ADMIN_TELEGRAM_ID=%s\n' "$INITIAL_ADMIN_TELEGRAM_ID"
            printf 'SESSION_SECRET=%s\n' "$SESSION_SECRET"
            printf 'SITE_ORIGIN=%s\n' "$SITE_ORIGIN"
          } > .env.ci

      - name: Install Neon CLI
        run: npm install --global neon@latest

      - name: Deploy declared function and bundle dependencies
        run: neon deploy --project-id dry-shape-51006688 --branch br-little-union-b9iipjfz --env .env.ci

      - name: Remove temporary environment
        if: always()
        run: rm -f .env.ci
