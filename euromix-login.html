<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#11101c">
<title>Euromix · NettleGroup Verify</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 15%,#35245b 0,#171426 42%,#0b0b12 100%);color:#fff;font:16px system-ui,-apple-system,Segoe UI,sans-serif}.card{width:min(100%,440px);padding:34px 26px;border:1px solid #ffffff20;border-radius:26px;background:#171523eF;box-shadow:0 24px 80px #0008;text-align:center}.logo{font-weight:900;letter-spacing:.22em;font-size:23px}.logo span{color:#bd9cff}.sub{color:#aaa5bc;line-height:1.6;font-size:14px;margin:12px 0 28px}.slot{min-height:52px;display:flex;justify-content:center;align-items:center}.status{margin-top:22px;min-height:42px;color:#b9b3ca;font-size:13px;line-height:1.5}.status.error{color:#ff9eaa}.status.ok{color:#a7e6bd}.spinner{width:18px;height:18px;border:2px solid #ffffff30;border-top-color:#bd9cff;border-radius:50%;display:inline-block;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}.foot{margin-top:30px;color:#716b82;font-size:10px;letter-spacing:.12em}
</style>
</head>
<body>
<main class="card">
  <div class="logo">EURO<span>MIX</span></div>
  <p class="sub">Вход через единую систему идентификации <b>NettleGroup Verify</b>.<br>Пароль от Telegram не требуется.</p>
  <div id="widget" class="slot"></div>
  <div id="status" class="status">Подтвердите вход через Telegram, чтобы продолжить.</div>
  <div class="foot">SECURE SIGN-IN · NETTLE GROUP</div>
</main>
<script>
const API="https://api.nettlegroup.space";
const statusEl=document.getElementById("status");
function status(message,kind=""){statusEl.className="status "+kind;statusEl.textContent=message;}
window.onTelegramAuth=async function(user){
  status("Проверяем подпись NettleGroup Verify…");
  try{
    const response=await fetch(API+"/api/auth/telegram",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify(user)});
    const data=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(data.error||"Не удалось подтвердить Telegram");
    const sessionResponse=await fetch(API+"/api/session",{credentials:"include",cache:"no-store"});
    const session=await sessionResponse.json();
    if(!sessionResponse.ok||!session.authenticated||!session.user)throw new Error("Сессия не создана");
    status("Вход подтверждён. Возвращаемся в Euromix…","ok");
    if(window.EuromixAuth&&typeof window.EuromixAuth.onAuthenticated==="function"){
      window.EuromixAuth.onAuthenticated(JSON.stringify(session.user));
    }
    setTimeout(()=>{try{window.location.href="euromix://auth/success";}catch(_){}},500);
  }catch(error){status("Ошибка входа: "+error.message,"error");}
};
const script=document.createElement("script");
script.src="https://telegram.org/js/telegram-widget.js?22";
script.async=true;
script.setAttribute("data-telegram-login","Verify_NettleBOT");
script.setAttribute("data-size","large");
script.setAttribute("data-userpic","false");
script.setAttribute("data-request-access","write");
script.setAttribute("data-onauth","onTelegramAuth(user)");
document.getElementById("widget").appendChild(script);
</script>
</body>
</html>
